[project]
name = "alam"
version = "0.1.0"
description = "ALAM (Adaptive Learning Associative Memory) — a personal AI media companion."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "structlog>=24.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    # starlette>=1.3 deprecates httpx 0.x in TestClient; httpx2 is the supported
    # client and `filterwarnings = error` turns the deprecation into a failure.
    "httpx2>=2.0",
    "ruff>=0.8",
    "mypy>=1.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["alam"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "TC", "RUF"]

[tool.ruff.lint.flake8-type-checking]
# Pydantic resolves annotations at runtime, so imports feeding a model field
# must stay out of TYPE_CHECKING blocks or validation breaks at import time.
# CLAUDE.md mandates Pydantic v2 for all boundary types, so this will matter.
runtime-evaluated-base-classes = [
    "pydantic.BaseModel",
    "pydantic_settings.BaseSettings",
]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]

# CLAUDE.md rule 3 / conventions: domain/ is pure and held to --strict.
# Everything else runs at the standard settings above.
[[tool.mypy.overrides]]
module = "alam.domain.*"
strict = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error"]
