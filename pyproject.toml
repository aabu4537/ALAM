[project]
name = "alam"
version = "0.1.0"
description = "ALAM (Adaptive Learning Associative Memory) — a personal AI media companion."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "structlog>=24.4",
    "uuid6>=2024.7.10",
    # SQLAlchemy Vector type for the pgvector extension already enabled at M0.
    # See ADR-0008 for why the column it maps is unconstrained (no fixed N).
    "pgvector>=0.3",
    # Real providers behind the M0 Protocols (M5.5a): Anthropic for LLM
    # completions, OpenAI for Whisper transcription. Voyage AI (the chosen
    # embedding vendor) is called directly over its REST API with httpx
    # instead — its own SDK pulls in an unrelated langchain toolchain for
    # what is otherwise one JSON endpoint.
    "anthropic>=0.120.2",
    "openai>=2.52.0",
    "httpx>=0.28.1",
    # Validates a fake provider's canned response against response_schema
    # (schema-constrained decoding, follow-up to M5.5a) — a fake must not
    # be able to return a shape no real, schema-constrained provider could.
    "jsonschema>=4.26.0",
]

[dependency-groups]
# Local ($0) providers (M5.5a task 2), split out of [project.dependencies]
# rather than added there directly — found only while merging this branch,
# when the requirements.txt CI check and the Vercel preview build both
# picked up the newly-heavy dependency tree. Ollama itself reuses the
# openai client above via a base-url override, no new dependency; these two
# do add real weight — sentence-transformers pulls in torch (~100MB+
# download, ~400MB+ installed) and faster-whisper pulls in ctranslate2 —
# because both run inference in-process rather than against a server.
# `requirements.txt` is generated with no `--group` flag (see its own CI
# job), so this group is excluded from it by construction: Vercel's Python
# builder installs from requirements.txt, and the deployed instance runs on
# fakes only (ALLOW_PAID_PROVIDERS unset, ALAM_*_PROVIDER=fake) and never
# imports these modules — see the README's "runs on fakes only" limitation,
# which described this constraint before the dependency declaration actually
# enforced it. `uv sync --all-groups` (CI's lint/typecheck/test jobs) and the
# Dockerfile's explicit `--group local` still install it.
local = [
    "sentence-transformers>=5.6.1",
    "faster-whisper>=1.2.1",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    # starlette>=1.3 deprecates httpx 0.x in TestClient; httpx2 is the supported
    # client and `filterwarnings = error` turns the deprecation into a failure.
    "httpx2>=2.0",
    "ruff>=0.8",
    "mypy>=1.14",
    "types-jsonschema>=4.26.0.20260518",
]

[tool.uv]
# Without this, uv treats every group in [dependency-groups] as "default" —
# a bare `uv sync` or `uv export` would pull in `local` (torch,
# ctranslate2) same as `dev`. Restricting the default to `dev` means `local`
# only installs when asked for (`--group local` or `--all-groups`), which is
# what makes `requirements.txt`'s CI regeneration (`--no-dev`, no `--group`
# flag) exclude it without needing its own `--no-group local` flag.
default-groups = ["dev"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["alam"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "TC", "RUF"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom is a call in an argument default. B008
# exists to catch mutable defaults; these are neither mutable nor accidental.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Header",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
]

[tool.ruff.lint.flake8-type-checking]
# Pydantic resolves annotations at runtime, so imports feeding a model field
# must stay out of TYPE_CHECKING blocks or validation breaks at import time.
# CLAUDE.md mandates Pydantic v2 for all boundary types, so this will matter.
runtime-evaluated-base-classes = [
    "pydantic.BaseModel",
    "pydantic_settings.BaseSettings",
    # SQLAlchemy resolves Mapped[...] annotations at runtime to build the
    # mapping, so a model's `uuid` / `datetime` imports cannot be deferred.
    "sqlalchemy.orm.DeclarativeBase",
    "alam.persistence.base.Base",
]
runtime-evaluated-decorators = ["sqlalchemy.orm.declared_attr"]

[tool.ruff.lint.per-file-ignores]
# Migrations are append-only history; a stale lint rule must never be a reason
# to edit one that has already been applied.
"alam/persistence/migrations/versions/*" = ["TC003", "E501"]
# The mixins here carry Mapped[...] annotations but inherit from nothing, so
# runtime-evaluated-base-classes cannot see them. Deferring these imports
# breaks mapper configuration at import time.
"alam/persistence/base.py" = ["TC003"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]

# CLAUDE.md rule 3 / conventions: domain/ is pure and held to --strict.
# Everything else runs at the standard settings above.
[[tool.mypy.overrides]]
module = "alam.domain.*"
strict = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# faster-whisper ships no py.typed marker / stubs (M5.5a task 2).
[[tool.mypy.overrides]]
module = "faster_whisper.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error"]
markers = [
    "db: requires a live Postgres with pgvector (ALAM_TEST_DATABASE_URL)",
]
